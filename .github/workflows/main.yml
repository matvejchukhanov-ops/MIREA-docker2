# Конвейер файлового менеджера: сборка -> тесты -> SAST -> локальное развёртывание.
#
# Локально запускается утилитой act (настройки в .actrc):
#     act push
# В GitHub Actions нет ключевого слова stages: стадии — это задания с именами
# стадий, а строгий порядок задаёт цепочка needs. Следующая стадия стартует,
# только если предыдущая прошла.

name: CI

on:
  push:
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"
  IMAGE: filemanager
  CONTAINER: filemanager
  WEB_IMAGE: filemanager-web
  WEB_CONTAINER: filemanager-web
  NETWORK: filemanager-net

jobs:
  # ---------------------------------------------------------------- build
  build:
    name: "stage: build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Синтаксическая ошибка в любом модуле остановит конвейер уже здесь.
      - name: Compile to bytecode
        run: python -m compileall -q server client common web

      - name: Package sources
        run: tar czf filemanager-src.tar.gz --exclude=__pycache__ server client common web

      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: filemanager-src.tar.gz

  # ---------------------------------------------------------------- test
  test:
    name: "stage: test"
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Кэш скачанных пакетов. Ключ — хэш списка зависимостей: изменился
      # список, кэш собирается заново.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements-dev.txt') }}

      - name: Install test tools
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: coverage run --source=server,client,common,web -m pytest tests --junitxml=reports/junit.xml

      # Cobertura: формат отчёта о покрытии, его понимают GitLab и Jenkins.
      - name: Coverage report
        if: always()
        run: |
          coverage xml -o reports/coverage.xml
          coverage report

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: reports/

  # ---------------------------------------------------------------- sast
  sast:
    name: "stage: sast"
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements-dev.txt') }}

      - name: Install Semgrep
        run: pip install -r requirements-dev.txt

      # --severity ERROR — только серьёзные находки (High и Critical).
      # --error — при них ненулевой код выхода, задание и весь конвейер падают.
      # p/javascript проверяет страницу веб-интерфейса: innerHTML, eval и
      # другие пути к XSS.
      - name: Semgrep scan
        run: |
          mkdir -p reports
          semgrep scan \
            --config p/python \
            --config p/javascript \
            --config p/secrets \
            --severity ERROR \
            --error \
            --metrics=off \
            --json-output=reports/semgrep.json \
            server client common web ci

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sast-report
          path: reports/

  # ---------------------------------------------------------------- deploy
  deploy:
    name: "stage: deploy"
    needs: sast
    runs-on: ubuntu-latest
    env:
      SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: |
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
          docker build --target web -t "$WEB_IMAGE:${{ github.sha }}" -t "$WEB_IMAGE:latest" .

      # Сервер и веб-интерфейс в общей сети Docker: шлюз находит сервер по
      # имени контейнера. Порты публикуются только на 127.0.0.1: с этого
      # компьютера доступны, из локальной сети нет. База и файлы — в
      # именованных томах: новый контейнер подключает те же тома, и
      # пользователи с файлами переживают повторное развёртывание.
      - name: Run containers
        run: |
          docker network create "$NETWORK" 2>/dev/null || true
          docker rm -f "$WEB_CONTAINER" "$CONTAINER" 2>/dev/null || true
          docker run -d \
            --name "$CONTAINER" \
            --network "$NETWORK" \
            --restart unless-stopped \
            -p 127.0.0.1:9000:9000 \
            -v filemanager-data:/app/data \
            -v filemanager-storage:/app/storage \
            "$IMAGE:${{ github.sha }}"
          docker run -d \
            --name "$WEB_CONTAINER" \
            --network "$NETWORK" \
            --restart unless-stopped \
            -p 127.0.0.1:8080:8080 \
            -e FM_SERVER_HOST="$CONTAINER" \
            "$WEB_IMAGE:${{ github.sha }}"

      - name: Smoke test (server)
        run: docker exec -i -e SMOKE_PASSWORD "$CONTAINER" python - < ci/smoke.py

      - name: Smoke test (web)
        run: docker exec -i "$WEB_CONTAINER" python - < ci/web_smoke.py

      - name: Container logs
        if: failure()
        run: |
          docker logs "$CONTAINER"
          docker logs "$WEB_CONTAINER"

      - name: Save images
        run: docker save "$IMAGE:${{ github.sha }}" "$WEB_IMAGE:${{ github.sha }}" | gzip > image.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar.gz
          compression-level: 0
